name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          # Keep CI on the same version as .tool-versions so `make lint` locally
          # matches CI. Bump both together, deliberately.
          version: v0.10.0
        env:
          SHELLCHECK_OPTS: -x

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mfinelli/setup-shfmt@v4
        with:
          shfmt-version: 3.8.0
      - run: shfmt -d bin lib test
